<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — Lập ngân sách định biên</title>
<!-- CSS nội tuyến, không dùng /styles.css: middleware chặn mọi file tĩnh khi
     chưa có phiên hợp lệ, nên trang này phải tự đứng được một mình.
     Các quy tắc dưới đây trích nguyên từ styles.css để giao diện liền mạch. -->
<!-- Chế độ sáng/tối: cùng một đoạn với index.html, và cũng phải chạy TRƯỚC lần
     vẽ đầu tiên. Trang này không nạp được module nên chép lại là bắt buộc —
     bản đầy đủ ở src/ui/theme.js, sửa thì sửa cả ba. -->
<script>
(function () {
  var m = "auto";
  try { m = localStorage.getItem("bp_theme") || "auto"; } catch (e) { /* chặn đọc thì thôi */ }
  var dark = m === "dark" || (m !== "light" && window.matchMedia
    && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
})();
</script>
<style>
:root {
  --ink: #0F1D24;
  --ink-2: #1B2E37;
  --ink-3: #33474F;
  --soft: #66787F;
  --bone-2: #F4F6F1;
  --panel: #FFFFFF;
  --rule: #CBD3CD;
  --rule-2: #E1E6DF;
  --mineral: #14664F;
  --mineral-2: #E4EFE9;
  --danger: #8E2B2B;
  --focus: #2E7D8F;
  --field: #FFFFFF;
  --rail-bg: #0F1D24;
  --pri-bg: #0F1D24;
  --pri-bg-2: #1B2E37;
  --pri-ink: #FFFFFF;
  --on-mineral: #FFFFFF;
  --ribbon-off: #EDF0EB;
  --ribbon-off-ink: #A8B3AD;
  --disp: "Bahnschrift", "Segoe UI Semibold", "Segoe UI", system-ui, sans-serif;
  --body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --mono: "Consolas", "Cascadia Mono", ui-monospace, "SF Mono", monospace;
  --r: 3px;
  --ctl: 32px;
}
/* Cùng bảng màu tối với styles.css, rút gọn còn đúng những biến trang này dùng. */
[data-theme="dark"] {
  --ink: #E3EAE7;
  --ink-2: #CDD8D3;
  --ink-3: #AEBCB7;
  --soft: #8B9A95;
  --bone-2: #1A2429;
  --panel: #151E22;
  --field: #1C262B;
  --rule: #2F3D43;
  --rule-2: #253238;
  --mineral: #55B694;
  --mineral-2: #16302A;
  --danger: #E48585;
  --focus: #5CB9CC;
  --rail-bg: #080F12;
  --pri-bg: #E3EAE7;
  --pri-bg-2: #FFFFFF;
  --pri-ink: #0F1D24;
  --on-mineral: #071C15;
  --ribbon-off: #1E282C;
  --ribbon-off-ink: #5A6965;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 14px/1.45 var(--body); color: var(--ink); background: var(--rail-bg); -webkit-font-smoothing: antialiased; }
/* Ô nhập và nút KHÔNG tự thừa kế màu chữ của trang — mặc định của trình duyệt
   là chữ đen. Trên nền tối của --field thì gõ mật khẩu vào gần như không đọc
   được. styles.css của app có đúng dòng này; trang đăng nhập dùng CSS riêng
   (middleware chặn file tĩnh khi chưa có phiên) nên phải chép lại. */
button, input, select, textarea { font: inherit; color: inherit; }
::placeholder { color: var(--soft); opacity: 1; }

.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--rail-bg); }
.login .card { background: var(--panel); border-radius: var(--r); width: 100%; max-width: 400px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.login h1 { margin: 0 0 4px; font: 600 20px var(--disp); letter-spacing: .05em; text-transform: uppercase; }
.login p.sub { margin: 0 0 20px; color: var(--soft); font-size: 12.5px; }
.login .msg { margin-top: 10px; font-size: 12.5px; min-height: 18px; }
.login .msg.bad { color: var(--danger); }
.login .msg.ok { color: var(--mineral); }
.login .btn { width: 100%; justify-content: center; margin-top: 14px; padding: 9px; }
.login .ribbon { margin-bottom: 16px; }

label.f { display: block; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--soft); margin-bottom: 3px; }
input[type=password], input[type=text] {
  border: 1px solid var(--rule); border-radius: var(--r); background: var(--field); width: 100%;
  font-size: 13px; height: var(--ctl); padding: 0 34px 0 8px; line-height: normal;
  color: var(--ink);
}
input[type=password]:focus, input[type=text]:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
/* Edge tự vẽ một con mắt "hiện mật khẩu" bằng ảnh đen, không theo được chế độ
   tối. Tắt nó đi và dùng nút của chính mình — nút này ăn màu theo biến. */
input[type=password]::-ms-reveal, input[type=password]::-ms-clear { display: none; }
.pwwrap { position: relative; }
.pwwrap .eye {
  position: absolute; right: 1px; top: 1px; bottom: 1px; width: 32px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 0; cursor: pointer; padding: 0;
  color: var(--soft); font-size: 14px; line-height: 1; border-radius: 0 var(--r) var(--r) 0;
}
.pwwrap .eye:hover { color: var(--ink); }
.pwwrap .eye:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.btn {
  background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r);
  height: var(--ctl); padding: 0 12px;
  cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  white-space: nowrap; font-family: inherit;
}
.btn:hover { border-color: var(--ink-3); }
.btn.pri { background: var(--pri-bg); color: var(--pri-ink); border-color: var(--pri-bg); }
.btn.pri:hover { background: var(--pri-bg-2); border-color: var(--pri-bg-2); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.ribbon { display: inline-flex; gap: 1px; vertical-align: middle; }
.ribbon i {
  width: 13px; height: 15px; background: var(--ribbon-off); border: 1px solid var(--rule-2); border-radius: 1px;
  display: inline-block; font: 600 8px/14px var(--mono); text-align: center; color: var(--ribbon-off-ink); font-style: normal;
  cursor: default;
}
.ribbon i.on { background: var(--mineral); border-color: var(--mineral); color: var(--on-mineral); }
</style>
</head>
<body>
  <div class="login">
    <div class="card">
      <span class="ribbon" id="ribbon"></span>
      <h1>Lập ngân sách</h1>
      <p class="sub">Công cụ dựng ngân sách từ bảng định biên</p>
      <label class="f" for="pass">Mật khẩu</label>
      <div class="pwwrap">
        <input id="pass" type="password" placeholder="Nhập mật khẩu" autofocus autocomplete="current-password" />
        <button type="button" class="eye" id="eye" aria-label="Hiện mật khẩu" aria-pressed="false" title="Hiện mật khẩu">👁</button>
      </div>
      <button class="btn pri" id="btn">Đăng nhập</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <script>
    /* Dải 12 tháng — chữ ký thị giác của app, dựng lại y như hàm ribbon() bản gốc */
    var r = document.getElementById("ribbon");
    for (var m = 1; m <= 12; m++) {
      var i = document.createElement("i");
      i.className = "on";
      i.title = "T" + String(m).padStart(2, "0");
      r.appendChild(i);
    }

    const btn = document.getElementById("btn");
    const input = document.getElementById("pass");
    const msg = document.getElementById("msg");
    const eye = document.getElementById("eye");

    /* Hiện / giấu mật khẩu. Giữ con trỏ ở đúng chỗ đang gõ: đổi type sẽ đặt lại
       vị trí con trỏ về cuối, nên nhớ rồi trả lại. */
    eye.addEventListener("click", function () {
      const show = input.type === "password";
      const at = input.selectionStart;
      input.type = show ? "text" : "password";
      eye.setAttribute("aria-pressed", String(show));
      eye.title = eye.ariaLabel = show ? "Giấu mật khẩu" : "Hiện mật khẩu";
      eye.textContent = show ? "🙈" : "👁";
      input.focus();
      try { input.setSelectionRange(at, at); } catch (e) { /* type=password chặn ở vài trình duyệt */ }
    });

    async function login() {
      const password = input.value;
      if (!password) {
        msg.className = "msg bad";
        msg.textContent = "Chưa nhập mật khẩu.";
        return;
      }
      btn.disabled = true;
      msg.className = "msg";
      msg.textContent = "Đang kiểm tra...";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        btn.disabled = false;
        if (data.ok) {
          msg.className = "msg ok";
          msg.textContent = "Đúng rồi, đang mở...";
          location.href = "/";
        } else if (data.reason === "wrong") {
          msg.className = "msg bad";
          msg.textContent = "Mật khẩu không đúng.";
          input.select();
        } else {
          msg.className = "msg bad";
          msg.textContent = "Không xác thực được, thử lại sau.";
        }
      } catch (e) {
        btn.disabled = false;
        msg.className = "msg bad";
        msg.textContent = "Lỗi mạng, thử lại.";
      }
    }

    btn.addEventListener("click", login);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
  </script>
</body>
</html>
